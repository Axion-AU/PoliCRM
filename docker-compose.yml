services:
  # ============================================================
  # PostgreSQL database (shared across profiles)
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: policrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-policrm}
      POSTGRES_USER: ${POSTGRES_USER:-policrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-policrm_dev_2024}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-policrm} -d ${POSTGRES_DB:-policrm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Rust backend (default service)
  # ============================================================
  backend-rs:
    build:
      context: .
      dockerfile: Dockerfile.backend-rs
    image: ${BACKEND_RS_IMAGE:-ghcr.io/policrm/policrm-backend-rs:latest}
    container_name: policrm-backend-rs
    restart: unless-stopped
    ports:
      - "${BACKEND_RS_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-policrm}:${POSTGRES_PASSWORD:-policrm_dev_2024}@postgres:5432/${POSTGRES_DB:-policrm}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ERA_DIR=/app/era
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - ${ERA_DIR:-./era}:/app/era
      - crm_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================
  # Legacy app: Python FastAPI + React frontend
  # ============================================================
  app:
    profiles:
      - legacy
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-ghcr.io/policrm/policrm-app:latest}
    container_name: policrm-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-policrm}:${POSTGRES_PASSWORD:-policrm_dev_2024}@postgres:5432/${POSTGRES_DB:-policrm}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - DEBUG=${DEBUG:-false}
    volumes:
      - ${ERA_DIR:-./era}:/app/era
      - crm_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  crm_data:
